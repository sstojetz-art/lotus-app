<style>
:root{--gold:#D5B863;--gold2:#F1DC9A;--gold3:#A8873A;--ink:#050403;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#bg{position:fixed;inset:-4%;background:#05070d url(img/cle.jpg) center 42%/cover no-repeat;animation:kb 38s ease-in-out infinite alternate;filter:saturate(1.05) contrast(1.05)}
@media (max-width:720px) and (orientation:portrait){#bg{background-image:url(img/cle-tall.jpg);background-position:50% 40%}}
@keyframes kb{0%{transform:scale(1.04) translate3d(0,0,0)}100%{transform:scale(1.14) translate3d(-2.2%,-1.4%,0)}}
#tint{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 38%,rgba(5,4,3,.05),rgba(5,4,3,.55) 60%,rgba(5,4,3,.92)),linear-gradient(180deg,rgba(5,4,3,.55),rgba(5,4,3,.1) 30%,rgba(5,4,3,.35) 62%,rgba(5,4,3,.96))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#art{position:fixed;left:-2%;bottom:3%;width:min(46vw,620px);opacity:.3;pointer-events:none;filter:drop-shadow(0 0 10px rgba(213,184,99,.5))}
#art path,#art ellipse,#art rect,#art circle,#art line{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l,900);stroke-dashoffset:var(--l,900);animation:draw 3.6s cubic-bezier(.6,.05,.25,1) forwards}
#art .hw{stroke:#fff6d8;stroke-width:2.6}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:720px){#art{width:82vw;left:-14vw;bottom:2%;opacity:.14}}
#rays{position:fixed;left:50%;top:var(--ry,30%);width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(241,220,154,.07) 0deg 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 90s linear infinite;pointer-events:none;opacity:0;transition:opacity 2s}
body.ready #rays{opacity:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 24px) 22px calc(var(--sab) + 24px);text-align:center}
#lotus{width:min(150px,30vw);height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(213,184,99,.55)) drop-shadow(0 0 2px rgba(255,240,200,.8))}
#lotus .pt{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transform:scale(.2) rotate(var(--r,0deg));animation:bloom 1.4s cubic-bezier(.2,1.5,.35,1) forwards;animation-delay:var(--d,0s)}
@keyframes bloom{to{opacity:1;transform:scale(1) rotate(0deg)}}
#lotus .glint{opacity:0;animation:glint 5.5s ease-in-out 2.2s infinite}
@keyframes glint{0%,70%,100%{opacity:0;transform:translateX(-140px)}80%{opacity:.85}92%{opacity:0;transform:translateX(160px)}}
.wm{margin:14px 0 2px;font:600 clamp(26px,5.4vw,46px)/1 "Didot","Bodoni MT","Playfair Display",Georgia,serif;letter-spacing:.32em;padding-left:.32em;color:#F1DC9A;text-shadow:0 0 22px rgba(213,184,99,.55),0 2px 0 rgba(0,0,0,.6);white-space:nowrap}
.wm span{display:inline-block;animation-fill-mode:forwards;opacity:0;transform:translateY(14px);filter:blur(6px);animation:rise .9s cubic-bezier(.2,1,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.wm.lit span{animation:none;opacity:1;transform:none;filter:none}
.wm span.sh{color:#fff7dc;text-shadow:0 0 18px #fff3c9,0 0 34px rgba(241,220,154,.9);transition:color .25s,text-shadow .25s}
main:before{content:"";position:absolute;left:50%;top:50%;width:min(760px,130vw);height:min(620px,110vh);transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(5,4,3,.62),rgba(5,4,3,.35) 55%,transparent);pointer-events:none;z-index:-1}
@keyframes sheen{to{background-position:-220% 0}}
.sub{font:500 11px/1.4 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.42em;padding-left:.42em;color:rgba(241,220,154,.85);text-transform:uppercase;opacity:0;animation:fade 1.2s ease 1.6s forwards}
.tag{margin:12px 0 0;font:italic 400 clamp(15px,2.4vw,18px)/1.4 Georgia,serif;color:rgba(255,255,255,.86);opacity:0;animation:fade 1.2s ease 2s forwards}

.card:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(241,220,154,.9) 80%,transparent 90%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:orbit 5s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes orbit{to{--a:360deg}}
.card h2{margin:0 0 4px;font:400 21px/1.2 Georgia,serif;color:#fff}
.card p.k{margin:0 0 14px;font-size:13px;color:rgba(255,255,255,.62)}
.fld{position:relative}

.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(213,184,99,.16)}
.fld button{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:rgba(241,220,154,.8);cursor:pointer}
.fld button svg{width:22px;height:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 14px;font-size:13.5px;color:rgba(255,255,255,.78)}
.row label{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.row input{width:20px;height:20px;accent-color:var(--gold)}
.go{width:100%;height:54px;border:0;border-radius:14px;cursor:pointer;font:700 15px/1 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#120d04;background:linear-gradient(100deg,#B8923F,#F3DFA0 45%,#D5B863 60%,#9e7c2e);background-size:200% 100%;box-shadow:0 10px 30px rgba(213,184,99,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .2s,background-position .6s}
.go:hover{background-position:100% 0;box-shadow:0 14px 40px rgba(213,184,99,.5)}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.75;cursor:wait}
.msg{min-height:20px;margin:10px 0 0;font-size:13.5px;color:#ffcf8a}
.card.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.foot{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 12px);font:500 10.5px/1.5 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.3em;color:rgba(241,220,154,.55);text-transform:uppercase;text-align:center;pointer-events:none;opacity:0;animation:fade 1.5s ease 3s forwards}
#snd{position:fixed;top:calc(var(--sat) + 12px);right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(213,184,99,.4);background:rgba(0,0,0,.35);color:var(--gold2);cursor:pointer;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#snd svg{width:20px;height:20px}
#snd.off .on,#snd:not(.off) .off{display:none}
#veil{position:fixed;inset:0;background:radial-gradient(circle at 50% var(--ry,30%),rgba(255,240,200,.95),rgba(213,184,99,.6) 18%,rgba(5,4,3,1) 60%);opacity:0;pointer-events:none;transition:opacity .9s ease}
body.go-out #veil{opacity:1}
body.go-out main{transform:scale(1.06);opacity:0;transition:transform 1s ease,opacity .8s ease}
body.auto .card{display:none}
body.auto .tag{animation-delay:.9s}
#ios{display:none}
.hint{margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.45}
.hint b{color:var(--gold2);font-weight:600}
@media (max-height:640px){.tag{display:none}.card{margin-top:16px}}
@media (prefers-reduced-motion:reduce){#bg,#rays,.wm{animation:none}}
</style>

function index(){return fetch('vault/index.json',{cache:'no-store'}).catch(function(){return caches.match('vault/index.json')}).then(function(r){if(!r)throw new Error('offline');return r.json()})}
function derive(pw,salt,iter){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})}
function fetchVault(f,v){return fetch('vault/'+f+'?v='+v,{cache:'no-cache'}).catch(function(){return caches.match('vault/'+f+'?v='+v)}).then(function(r){if(!r||!r.ok)throw new Error('vault');return r.arrayBuffer()})}
function open(key,buf){var u=new Uint8Array(buf),iv=u.slice(0,12),ct=u.slice(12);return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct).then(function(pt){
  if(typeof DecompressionStream==='undefined')return new TextDecoder().decode(pt);
  var ds=new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')));return ds.text()})}
function launch(html,who){
  try{sessionStorage.setItem('lotus-who',who)}catch(e){}
  chimeOpen();goldBurst();document.body.classList.add('go-out');
  setTimeout(function(){document.open();document.write(html);document.close()},1150)}

      return derive(pw,u.salt,ix.iter).then(function(key){return fetchVault(u.f,ix.v).then(function(buf){return open(key,buf)}).then(function(html){
        var keep=$('keep').checked;return(keep?kput({u:u.id,key:key}):Promise.resolve()).then(function(){launch(html,u.id)})},function(){return next()})})}
    return next()}).catch(function(){fail('No connection. Connect to the internet once to sign in.')})});
